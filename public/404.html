<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ARK SPACES</title>
    <script type="text/javascript">
      // Single Page Application redirect for GitHub Pages and static hosts
      // Redirects 404 paths to root with a query parameter preserving full route and search
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/?p=' + encodeURIComponent(path + search) + hash);
    </script>
  </head>
  <body>
  </body>
</html>
